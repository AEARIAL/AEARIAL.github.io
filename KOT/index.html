    // layoutの実行時、wに条件「rotated」に応じて高さまたは幅を保持する。hに条件「rotated」に応じて幅または高さを保持する。
    const w = rotated ? height : width, h = rotated ? width : height;
    // layoutの実行時、フレームの外観の幅を（w + 「px」）に更新する。フレームの外観の高さを（h + 「px」）に更新する。
    frame.style.width = w + 'px'; frame.style.height = h + 'px';
    // layoutの実行時、フレームの外観の左端を（（（幅 - w） / 2） + 「px」）に更新する。フレームの外観のtopを（（（高さ - h） / 2） + 「px」）に更新する。
    frame.style.left = (width - w) / 2 + 'px'; frame.style.top = (height - h) / 2 + 'px';
    // layoutの実行時、フレームの外観のtransformを条件「rotated」に応じて（（「rotate(」 + 条件「modeが「left」と等しい」に応じて90の符号反転値または90） + 「deg)」）または「効果なしマス」に更新する。
    frame.style.transform = rotated ? 'rotate(' + (mode === 'left' ? -90 : 90) + 'deg)' : 'none';
    // layoutの実行時、documentのgetElementByIdの結果（「display-state」）のtextContentを条件「rotated」に応じて条件「modeが「left」と等しい」に応じて「左回転」または「右回転」または「通常表示」に更新する。
    document.getElementById('display-state').textContent = rotated ? (mode === 'left' ? '左回転' : '右回転') : '通常表示';
    // layoutの実行時、menuのquerySelectorAllの結果（「[data-mode]」）の各項目について、ボタンのsetAttributeを実行する。渡す値は「aria-pressed」・Stringの結果（ボタンのdatasetのmodeがmodeと等しい）。
    for (const button of menu.querySelectorAll('[data-mode]')) button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
  // layoutの実行時で使う処理範囲をここで閉じる。
  }
  // Web画面の起動・操作時、toggleのonclickを引数 を使う処理に更新する。
  toggle.onclick = () => { menu.hidden = !menu.hidden; toggle.setAttribute('aria-expanded', String(!menu.hidden)); if (!menu.hidden) menu.querySelector('[aria-pressed="true"]').focus(); };
  // Web画面の起動・操作時、documentのgetElementByIdの結果（「display-close」）のonclickを引数 を使う処理に更新する。
  document.getElementById('display-close').onclick = () => { closeMenu(); toggle.focus(); };
  // Web画面の起動・操作時、menuのquerySelectorAllの結果（「[data-mode]」）の各項目について、ボタンのonclickを引数 を使う処理に更新する。
  for (const button of menu.querySelectorAll('[data-mode]')) button.onclick = () => {
    // Web画面の起動・操作時、modeをボタンのdatasetのmodeに更新する。
    mode = button.dataset.mode;
    // Web画面の起動・操作時、localStorageのsetItemを実行する。渡す値はstorageKey・mode。
    try { localStorage.setItem(storageKey, mode); } catch (_) {}
    // Web画面の起動・操作時、layoutを実行する。closeMenuを実行する。toggleのfocusを実行する。
    layout(); closeMenu(); toggle.focus();
  // inlineで使う処理範囲をここで閉じる。
  };
  // Web画面の起動・操作時、documentのaddEventListenerを実行する。渡す値は「keydown」・引数 イベント を使う処理。
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && !menu.hidden) { closeMenu(); toggle.focus(); event.preventDefault(); } });
  // Web画面の起動・操作時、addEventListenerを実行する。渡す値は「resize」・画面配置。
  addEventListener('resize', layout);
  // Web画面の起動・操作時、coarseのaddEventListenerを実行する。渡す値は「変更の鍵」・画面配置。
  coarse.addEventListener('change', layout);
  // Web画面の起動・操作時、ResizeObserverの新しいインスタンスのobserveを実行する。渡す値はstage。
  new ResizeObserver(layout).observe(stage);
  // Web画面の起動・操作時、layoutを実行する。
  layout();
// Web画面の起動・操作時、}())。
}());
// ページに組み込むスクリプトの定義をここで終える。
</script>
